name: Test Suite

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  test:
    name: Foundry Project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      # Fails if SuretyHook exceeds the 24,576-byte deploy limit (EIP-170).
      - name: Build
        run: |
          forge --version
          forge build --sizes
        id: build

      - name: Test
        run: |
          forge test -vvv
        id: test

  frontend:
    name: Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Unit tests: the liquidity maths, the simulation, the depositor steps.
      - name: Test
        run: npm test

      # Type-checks with tsc, then builds the production bundle.
      - name: Build
        run: npm run build
